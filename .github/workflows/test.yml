name: test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run all
      - run: node cli/spin-ladder.js render songs/level-1-loop.json --loop --stems --out /tmp/l1.wav
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy && python3 test/xcheck.py
